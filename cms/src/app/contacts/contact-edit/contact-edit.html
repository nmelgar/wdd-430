<div class="panel panel-default">
  <div class="panel-heading">
    <span class="title">Contact Edit</span>
  </div>

  <div class="panel-body">
    <form #f="ngForm" (ngSubmit)="onSubmit(f)">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          id="name"
          type="text"
          class="form-control"
          name="name"
          [ngModel]="contact?.name"
          required
          #name="ngModel"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="text"
          class="form-control"
          name="email"
          [ngModel]="contact?.email"
          required
          pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}$"
          #email="ngModel"
        />
        <div class="alert alert-danger" *ngIf="email.touched && email.invalid">
          Enter a valid Email address.
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone</label>
        <input
          id="phone"
          type="tel"
          class="form-control"
          name="phone"
          [ngModel]="contact?.phone"
          pattern="\(?[2-9]\d{2}\)?[-.\s]?[2-9]\d{2}[-.\s]?\d{4}"
          inputmode="numeric"
          #phone="ngModel"
        />
        <div class="alert alert-danger" *ngIf="phone.touched && phone.invalid">
          Enter a valid phone number.
        </div>
      </div>

      <div class="form-group">
        <label for="imageUrl">Image URL</label>
        <input
          id="imageUrl"
          type="text"
          class="form-control"
          name="imageUrl"
          [ngModel]="contact?.imageUrl"
          #imageUrl="ngModel"
        />
      </div>

      <div
        class="alert alert-danger"
        *ngIf="(name.touched && !name.valid) || (email.touched && !email.valid)"
      >
        The Name and Email fields are required.
      </div>

      <div class="btn-toolbar">
        <button class="btn btn-success" type="submit" [disabled]="!f.valid">
          Save
        </button>
        <button class="btn btn-primary" type="button" (click)="onCancel()">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
