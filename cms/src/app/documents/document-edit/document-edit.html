<div class="panel panel-default">
  <div class="panel-heading">
    <span class="title">Document Edit</span>
  </div>

  <div class="panel-body">
    <form #f="ngForm" (ngSubmit)="onSubmit(f)">
      <div class="form-group">
        <label for="name">Document Title</label>
        <input
          id="name"
          type="text"
          class="form-control"
          name="name"
          [ngModel]="document?.name"
          required
          #name="ngModel"
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          rows="4"
          class="form-control"
          name="description"
          [ngModel]="document?.description"
          #description="ngModel"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="url">Document URL</label>
        <input
          id="url"
          type="text"
          class="form-control"
          name="url"
          [ngModel]="document?.url"
          required
          #url="ngModel"
        />
      </div>

      <div class="alert alert-danger" *ngIf="!name.valid || !url.valid">
        The Document Title and Document URL are required fields.
      </div>

      <div class="btn-toolbar">
        <button class="btn btn-success" type="submit" [disabled]="!f.valid">
          Save
        </button>
        <button class="btn btn-primary" type="button" (click)="onCancel()">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
