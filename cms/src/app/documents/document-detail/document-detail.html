<div class="panel panel-default">
  <div class="panel-heading clearfix">
    <span class="title">{{ document?.name }}</span>
    <div class="pull-right">
      <a class="btn btn-primary" (click)="onView()">View</a>
      <a class="btn btn-info" [routerLink]="['/documents', document?.id, 'edit']">Edit</a>
      <a class="btn btn-danger" (click)="onDelete()">Delete</a>
    </div>
  </div>

  <div class="panel-body">
    <div class="row" style="margin-top: 15px">
      <div class="col-xs-12">
        <p style="font-size: 1.1em">
          <strong>Description:</strong> {{ document?.description }}
        </p>

        <p style="font-size: 1.1em">
          <strong>URL:</strong> {{ document?.url }}
        </p>
      </div>
    </div>
  </div>
</div>
